#
# Shell temperature mitigation. shell_max is fed by sltntc and is the
# skin sensor of the stock thermal HAL (LIGHT 39C, MODERATE 43C,
# CRITICAL 50C). These engine tiers do not change the HAL severity policy.
# Frequencies are volcano OPPs (silver+gold+prime, GPU).
#

[MONITOR-SHELL-CPU]
algo_type monitor
sampling 1000
sensor shell_max
thresholds 44000 46500 49000 52000
thresholds_clr 42000 44500 47000 50000
actions cpu-cluster0+cpu-cluster1+cpu-cluster2 cpu-cluster0+cpu-cluster1+cpu-cluster2 cpu-cluster0+cpu-cluster1+cpu-cluster2 cpu-cluster0+cpu-cluster1+cpu-cluster2
action_info 1804800+2208000+2304000 1593600+1920000+1900800 1344000+1612800+1651200 1113600+1286400+1324800

[MONITOR-SHELL-GPU]
algo_type monitor
sampling 1000
sensor shell_max
thresholds 44000 46500 49000
thresholds_clr 42000 44500 47000
actions gpu gpu gpu
action_info 895000000 688000000 510000000
